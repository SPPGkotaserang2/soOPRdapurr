<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Foto Absensi & Bahan Baku</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #0284c7, #38bdf8);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #0284c7;
        }
        .live-clock {
            text-align: center;
            background: linear-gradient(90deg, #dbeafe, #e0f2fe);
            color: #0369a1;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid #bae6fd;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-container img {
            width: 150px;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .title-group {
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { 
            margin: 0; 
            line-height: 1.2; 
        }
        .main-title {
            color: #1e3a8a;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .sub-title {
            color: #0284c7;
            font-size: 14px;
            font-weight: 700;
            margin-top: 3px;
        }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #1e293b; }
        select, input[type="file"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
            background-color: #f8fafc;
            transition: all 0.3s;
        }
        select:focus, input[type="file"]:focus, input[type="password"]:focus {
            border-color: #0284c7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.3s;
        }
        button:hover { 
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-refresh {
            background: linear-gradient(135deg, #0d9488, #0f766e) !important;
            margin-bottom: 15px;
            font-size: 13px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(13, 148, 136, 0.3);
        }
        .btn-refresh:hover {
            background: linear-gradient(135deg, #0f766e, #115e59) !important;
        }
        .btn-whatsapp {
            background: linear-gradient(135deg, #16a34a, #15803d) !important;
            margin-top: 12px;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(22, 163, 74, 0.6); }
            100% { transform: scale(1); }
        }
        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #15803d, #166534) !important;
        }
        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .warning-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .admin-section {
            margin-top: 25px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 15px;
            text-align: center;
        }
        .btn-admin {
            background: linear-gradient(135deg, #475569, #334155);
            font-size: 13px;
            padding: 8px;
            box-shadow: none;
        }
        .btn-admin:hover { background: linear-gradient(135deg, #334155, #1e293b); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            margin-top: 8px;
            font-size: 13px;
            padding: 8px;
            box-shadow: none;
        }
        .btn-danger:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    </style>
</head>
<body>

<div class="card">
    <!-- Jam & Hari Live -->
    <div id="liveClock" class="live-clock">Memuat Waktu...</div>

    <!-- Logo dari File Lokal -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo Instansi" onerror="this.style.display='none'">
    </div>

    <!-- Judul -->
    <div class="title-group">
        <h2 class="main-title">DOKUMENTASI</h2>
        <h2 class="sub-title">SPPG KOTA SERANG SERANG SERANG 2</h2>
    </div>

    <!-- Tombol Refresh / Sinkronisasi Publik Antar HP -->
    <button type="button" class="btn-refresh" onclick="fetchServerStatus()">🔄 Refresh & Sinkronkan Data Publik</button>
    
    <div id="warningBox" class="warning-box">
        ⚠️ <strong>PENGUMUMAN :</strong> FOTO WAJIB HARUS DI KIRIM SETIAP HARI. Ceklis (✅) menandakan kategori sudah di-upload hari ini oleh tim.
    </div>

    <!-- Form Upload -->
    <form id="uploadForm">
        <div class="form-group">
            <label for="nama">NAMA PENGIRIM FOTO</label>
            <select id="nama" name="nama" required onchange="renderKategoriDropdown()">
                <option value="">SIAPA YANG MAU KIRIM FOTO</option>
                <option value="LILI">LILI</option>
                <option value="MUAMAR">MUAMAR</option>
            </select>
        </div>

        <div class="form-group">
            <label for="kategori">PILIH FOTO APA YANG MAU DIKIRIM</label>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih Kategori --</option>
            </select>
        </div>

        <div class="form-group">
            <label>KIRIM FOTO PER DIVISI (BISA PILIH BANYAK FOTO SEKALIGUS):</label>
            <input type="file" id="Foto_1" accept="image/*" required style="margin-bottom: 6px;">
            <input type="file" id="Foto_2" accept="image/*" style="margin-bottom: 6px;">
            <input type="file" id="Foto_3" accept="image/*" style="margin-bottom: 6px;">
            <input type="file" id="Foto_4" accept="image/*" style="margin-bottom: 6px;">
            <input type="file" id="Foto_5" accept="image/*">
        </div>

        <button type="submit" id="btnSubmit">Kirim ke Sistem</button>
        <button type="button" id="btnWhatsApp" class="btn-whatsapp" onclick="sendToWhatsAppWithText()">💬 Klik Kirim Pesan Laporan ke WhatsApp</button>
        
        <div id="statusMessage"></div>
    </form>

    <!-- Menu Panel Admin -->
    <div class="admin-section">
        <button type="button" class="btn-admin" onclick="toggleAdminPanel()">Admin</button>
        <div id="adminPanel" style="display: none; margin-top: 10px;">
            <div class="form-group" style="margin-bottom: 8px;">
                <input type="password" id="adminPasswordInput" placeholder="Masukkan Password Admin">
            </div>
            <button type="button" class="btn" style="background: #0284c7; font-size: 13px; padding: 8px; margin-bottom: 5px;" onclick="verifyAdminPassword()">Masuk Admin</button>
            
            <div id="adminMenuOptions" style="display: none; margin-top: 10px;">
                <button type="button" class="btn-danger" onclick="resetKategoriData()">Reset Data Lokal</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Jam Live
    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('liveClock').innerHTML = `📅 ${now.toLocaleDateString('id-ID', options)} | ⏰ ${now.toLocaleTimeString('id-ID')} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ================= CONFIGURASI =================
    const ID_FOLDER_ABSENSI = "1egZm6HVSS8k9h3XG-uqKTnxdCu9_Jqp5";
    const ID_FOLDER_BAHAN_BAKU = "1NVVeIFqZUcMUu8l9_NYPIeV4LQk9qIig";
    const ID_FOLDER_LAINNYA = "MASUKKAN_ID_FOLDER_KETIGA_DISINI"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxx-dvpS95HRXyoyKmEedBKeF6g7Ksuts01OhZzeSYWTpJdtHhM1L9z_F0Ij6Ikd41BnA/exec";
    const WHATSAPP_NUMBER = "6283111399112"; 
    // ===============================================

    const ALL_CATEGORIES = [
        "FOTO ABSENSI RELAWAN", "FOTO BAHAN BAKU", "FOTO BAHAN BAKU RIJECK", "FOTO CLEANING SERVICE", "FOTO DAPUR",
        "FOTO DISTRIBUSI PENGIRIMAN", "FOTO DITRIBUSI SEKOLAH (ADMIN)", "FOTO GALON DAN GAS", "FOTO KENDARAAN", "FOTO KERJA BAKTI DAPUR",
        "FOTO LIMBAH B3", "FOTO SISA PEMORSIAN", "FOTO SISA FOODTRAY", "FOTO ANGKUT LIMBAH", "FOTO SERAH TERIMA SCURITY",
        "FOTO SERAH TERIMA PERSIAPAN KE PENGOLAHAN", "FOTO SERAH TERIMA PENGOLAHAN KE PEMORSIAN", "FOTO SERAH TERIMA PEMORSIAN KE DISTRIBUSI", "FOTO SERAH TERIMA DISTRIBUSI KE TIM FOODTRAY",
        "FOTO SERAH TERIMA FOODTRAY KE ASLAP", "FOTO TERIMA BAHAN BAKU", "FOTO TIM PERSIAPAN", "FOTO TIM PENGOLAHAN", "FOTO TIM PEMORSIAN",
        "FOTO TIM FOODTRAY", "FOTO SAAT SO BAHAN BAKU", "FOTO PERBAIKAN DI DAPUR (JIKA ADA)", "FOTO SAAT CUCI KENDARAAN", "FOTO SAAT MEMBERSIHAKN IPAL"
    ];

    let serverUploadedData = [];
    let activeNama = "";
    let activeKategori = "";
    let queueFiles = [];
    let currentQueueIndex = 0;
    let totalUploadedCount = 0;

    function fetchServerStatus() {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.style.color = "#0284c7";
        statusDiv.innerText = "⏳ Menyinkronkan data dari server...";

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getStatus" }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(response => {
            if(response.status === "success") {
                serverUploadedData = response.data;
                statusDiv.style.color = "#16a34a";
                statusDiv.innerText = "✅ Data berhasil disinkronkan!";
                renderKategoriDropdown();
                setTimeout(() => { statusDiv.innerText = ""; }, 3000);
            }
        })
        .catch(err => {
            statusDiv.style.color = "#dc2626";
            statusDiv.innerText = "❌ Gagal sinkronisasi ke server.";
        });
    }

    function renderKategoriDropdown() {
        const selectKategori = document.getElementById('kategori');
        selectKategori.innerHTML = '<option value="">-- Pilih Kategori --</option>';

        ALL_CATEGORIES.forEach(kat => {
            let option = document.createElement('option');
            option.value = kat;
            let isUploaded = serverUploadedData.some(item => item.kategori === kat);

            if (isUploaded) {
                option.textContent = `✅ ${kat} (Sudah diupload)`;
            } else {
                option.textContent = kat;
            }
            selectKategori.appendChild(option);
        });
    }

    window.onload = function() {
        fetchServerStatus();
    };

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        activeNama = document.getElementById('nama').value;
        activeKategori = document.getElementById('kategori').value;

        if (!activeNama || !activeKategori) {
            alert("Harap pilih Nama Pengirim dan Kategori Foto!");
            return;
        }

        queueFiles = [];
        for (let i = 1; i <= 5; i++) {
            let fileInput = document.getElementById('Foto_' + i);
            if (fileInput && fileInput.files[0]) {
                queueFiles.push(fileInput.files[0]);
            }
        }

        if (queueFiles.length === 0) {
            alert("Pilih minimal 1 foto terlebih dahulu!");
            return;
        }

        totalUploadedCount = queueFiles.length;
        document.getElementById('btnSubmit').disabled = true;
        document.getElementById('btnWhatsApp').style.display = 'none';
        document.getElementById('statusMessage').style.color = "#0284c7";

        currentQueueIndex = 0;
        processAndUploadFile();
    });

    // Fungsi untuk mengompres ukuran foto otomatis agar tidak error jaringan
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1024;
                const MAX_HEIGHT = 1024;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Kompres ke format JPEG dengan kualitas 0.7 (70%) agar ringan dikirim
                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                callback(dataUrl);
            };
        };
    }

    function processAndUploadFile() {
        if (currentQueueIndex >= queueFiles.length) {
            document.getElementById('statusMessage').style.color = "#16a34a";
            document.getElementById('statusMessage').innerText = `Sukses! ${totalUploadedCount} foto berhasil dikirim.`;
            
            document.getElementById('uploadForm').reset();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = false;
            btn.innerText = "Kirim ke Sistem";
            document.getElementById('btnWhatsApp').style.display = 'block';

            fetchServerStatus();
            return;
        }

        let file = queueFiles[currentQueueIndex];
        document.getElementById('statusMessage').innerText = `Mengompres & Mengunggah foto ${currentQueueIndex + 1} dari ${queueFiles.length}...`;

        let targetFolderId = ID_FOLDER_ABSENSI;
        if (activeKategori === "FOTO BAHAN BAKU") targetFolderId = ID_FOLDER_BAHAN_BAKU;

        compressImage(file, function(compressedDataUrl) {
            let payload = {
                folderId: targetFolderId,
                fileData: compressedDataUrl,
                fileName: `${activeNama}_${activeKategori}_${file.name}`,
                mimeType: "image/jpeg",
                nama: activeNama,
                kategori: activeKategori
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    currentQueueIndex++;
                    processAndUploadFile();
                } else {
                    alert("Gagal upload dari server: " + res.message);
                    document.getElementById('btnSubmit').disabled = false;
                }
            })
            .catch(err => {
                alert("Terjadi kesalahan jaringan. Periksa koneksi internet Anda atau kurangi jumlah foto yang dikirim sekaligus.");
                document.getElementById('btnSubmit').disabled = false;
            });
        });
    }

    function sendToWhatsAppWithText() {
        const message = `*LAPORAN DOKUMENTASI SPPG KOTA SERANG 2*\n\n` +
                        `👤 *Pengirim:* ${activeNama}\n` +
                        `📂 *Kategori:* ${activeKategori}\n` +
                        `📸 *Jumlah Foto:* ${totalUploadedCount} Foto\n` +
                        `⏰ *Waktu:* ${new Date().toLocaleString('id-ID')} WIB\n\n` +
                        `✅ Status: Foto telah berhasil di-upload ke sistem.`;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === "none" ? "block" : "none";
    }
    function verifyAdminPassword() {
        if (document.getElementById('adminPasswordInput').value === "Mandiri02srg") {
            document.getElementById('adminMenuOptions').style.display = "block";
            alert("Password benar!");
        } else {
            alert("Password salah!");
        }
    }
    function resetKategoriData() {
        localStorage.clear();
        alert("Cache lokal dibersihkan.");
        location.reload();
    }
</script>

</body>
</html>
